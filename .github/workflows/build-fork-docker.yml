name: Build fork development container

on:
  workflow_dispatch:
  push:
    branches:
      - fix/n2k-notification-dedup

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/pirateyachty/signalk-server

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'

      - name: Build and pack Signal K
        run: |
          npm cache clean -f
          npm install npm@latest -g
          npm install --package-lock-only
          npm ci
          npm run build:all
          npm pack --workspaces
          rm -f signalk-typedoc-signalk-theme*.tgz
          npm pack

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:notification-dedup
            ${{ env.IMAGE_NAME }}:notification-dedup-${{ github.sha }}
